# ReconForgeX Default Configuration
# 
# All modules are pure-Python. No external tools required.
# 
# Usage:
#   reconforgex -d example.com
#   reconforgex my_config.yaml

worker_count: 50
timeout: 30
retry_count: 3
output_directory: "output"
logging_level: "INFO"
html_report: true
json_report: true
markdown_report: true
modules:
  - http_fingerprinting
  - header_analyzer
  - security_header_scanner
  - tls_inspector
  - csp_analyzer
  - robots_parser
  - sitemap_parser
  - js_collector
  - js_endpoint_extractor
  - js_secret_detector
  - interesting_files
  - http_response_analyzer
  - risk_scoring