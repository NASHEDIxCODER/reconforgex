[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reconforgex"
version = "2.0.0"
description = "ReconForgeX — Asynchronous Python reconnaissance framework"
readme = "README.md"
authors = [
    { name = "nashedi_x_coder" },
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Internet",
    "Framework :: AsyncIO",
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.5",
]
monitoring = [
    "psutil>=5.9.0",
]
all = [
    "reconforgex[dev]",
    "reconforgex[monitoring]",
]

[project.urls]
Homepage = "https://github.com/NASHEDIxCODER/reconforgex"
Repository = "https://github.com/NASHEDIxCODER/reconforgex.git"
Documentation = "https://github.com/NASHEDIxCODER/reconforgex#readme"
"Bug Tracker" = "https://github.com/NASHEDIxCODER/reconforgex/issues"

[project.scripts]
reconforgex = "reconforgex.cli:main"

[tool.setuptools.packages.find]
include = ["reconforgex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "SIM"]
ignore = ["B904"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true