[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "recon"
version = "1.0.0"
description = "An advanced reconnaissance framework for security professionals."
readme = "README.md"
authors = [
    { name = "nashedi_x_coder" },
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]
optional-dependencies = {
    "dev": [
        "pytest>=7.0",
        "pytest-asyncio>=0.23",
        "pytest-cov>=4.0",
    ],
}

[project.urls]
Homepage = "https://github.com/NASHEDIxCODER/recon"
Repository = "https://github.com/NASHEDIxCODER/recon.git"

[project.scripts]
recon = "recon.cli:main"

[tool.setuptools.packages.find]
include = ["recon*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]